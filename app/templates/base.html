<!doctype html>
<html>
  {% include "navbar.html" %}
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}microsearch{% endblock %}</title>
    <link
      href="{{ url_for('static', path='/css/styles.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>{% block heading %}<a href="/">microsearch</a>{% endblock %}</h1>
    <form action="/search">
      <input name="q" value="{{ q }}" placeholder="검색어" required />
      <button>Search</button>
    </form>

    {% block content %} {% endblock %}
  </body>
</html>
